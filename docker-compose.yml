# Start:  cp .env.example .env  (edit passwords)  then:  docker compose up -d --build
# Real HTTPS on your own domain:  docker compose --profile https up -d --build
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: parksmart
      MYSQL_USER: parksmart
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:mysql://db:3306/parksmart?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: parksmart
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports: ["${APP_PORT:-8080}:8080"]
    volumes: [backups:/app/backups]
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:-localhost}" }
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to app:8080
    depends_on: [app]
volumes: { dbdata: {}, backups: {}, }
