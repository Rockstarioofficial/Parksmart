# MySQL (use jdbc:mysql://...) or MariaDB (jdbc:mariadb://...)
db.url=jdbc:mysql://localhost:3306/parksmart?useSSL=false&allowPublicKeyRetrieval=true
db.user=parksmart
db.password=CHANGE-THIS-DB-PASSWORD
# Leave blank: a random admin password is generated and printed ONCE on first start.
admin.password=
port=8443
# tls=true: https with an auto-made self-signed certificate (needed for phone camera on Wi-Fi).
# Behind a real HTTPS proxy (Caddy/nginx/Render) use tls=false and trust.proxy=true.
tls=true
trust.proxy=false
